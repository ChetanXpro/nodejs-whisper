name: Integration test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci
      env:
        NODEJS_WHISPER_SKIP_NATIVE: '1'

    - name: Build native addon
      run: npm run build:native

    - name: Prepare test models
      timeout-minutes: 10
      run: npm run test:models

    - name: Run native integration tests
      env:
        NODEJS_WHISPER_CMAKE_ARGS: ${{ runner.os == 'macOS' && '-DGGML_NATIVE=OFF' || '' }}
      run: npm run test:native

    - name: Package native binary
      run: npm run package:native

    - uses: actions/upload-artifact@v4
      with:
        name: native-${{ runner.os }}-${{ runner.arch }}
        path: prebuilds/
        if-no-files-found: error

    - name: Run unit tests
      run: npm test

    - name: Run integration test
      env:
        NODEJS_WHISPER_CMAKE_ARGS: ${{ runner.os == 'macOS' && '-DGGML_NATIVE=OFF' || '' }}
      run: npm run test:integration
